[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hescope"
version = "0.1.0"
description = "marimo-native + agent-native H&E pathology whole-slide viewer with a human-agent analysis loop"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "HE-Scope contributors" }]
keywords = ["pathology", "histology", "whole-slide-image", "marimo", "agent"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
# Single source of truth for dependencies. requirements.txt is a thin
# compatibility shim that points here (`-e .`).
dependencies = [
    "marimo>=0.23",
    "pillow",
    "numpy",
    "scipy",
    "scikit-image",
    "plotly",
    "requests",
    "tifffile",
    "zarr>=3",
    "imagecodecs",
    "sqlalchemy>=2.0",
    # Powers the OpenSeadragon viewer (hescope.osdviewer), which is the main
    # viewing surface: continuous mouse pan, wheel zoom and ROI drawing.
    # app.py falls back to the plotly viewer when this is missing, but that
    # fallback is for robustness -- it is not the intended default.
    "anywidget>=0.9",
]

[project.optional-dependencies]
# Real WSI formats via OpenSlide (.svs, .ndpi, .mrxs); needs the OpenSlide
# system library.
wsi = ["openslide-python"]
# DICOM VL Whole Slide Microscopy Image, what clinical scanners increasingly
# emit and the one format neither OpenSlide nor tifffile covers here.
# Deliberately optional and deliberately small: measured against this
# environment it resolves to 7 new packages with zero uninstalls and zero
# downgrades, which is why it is in-tree at all. (For contrast, tiatoolbox
# resolves to 152 installs and 22 uninstalls, including ipywidgets, on which
# the OpenSeadragon viewer depends -- see docs/ROADMAP-INTEROP.md.)
dicom = ["wsidicom>=0.20"]
# Weakly-supervised training (hescope.ml) + torch/FM embedding backends
# (hescope.features.extract_embedding, hescope.embeddings).
ml = ["scikit-learn", "joblib", "torch", "torchvision", "timm"]
test = ["pytest"]

[project.scripts]
hescope = "hescope.cli:main"

# app.py is shipped as a top-level module so that `hescope app` can locate it
# next to the installed hescope package (site-packages/app.py) exactly the
# same way it finds it at the repo root in an editable install.
[tool.setuptools]
packages = ["hescope"]
py-modules = ["app"]

# The OpenSeadragon viewer loads its vendored JS from inside the installed
# package, so the bundle has to ship in the wheel. Without this a wheel
# install silently falls back to the capped plotly viewer, because
# build_esm() cannot find openseadragon.min.js.
[tool.setuptools.package-data]
hescope = ["static/**/*.js", "static/**/*.txt", "static/**/*.md"]
